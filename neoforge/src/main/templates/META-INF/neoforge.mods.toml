license="${mod_license}"
issueTrackerURL="https://github.com/fssniper/minecraft-nbtedit-mod/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/fssniper/minecraft-nbtedit-mod"
iconFile="assets/nbtedit/icon.png"
authors="meltedkeyboard, keybie_"
description='''
In-game NBT and JSON editor for singleplayer worlds. Browse the world folder, walk the chunks on a surface map, open level.dat, playerdata or a chunk in a tree, search the whole world for a tag, edit and save without leaving the game. The world you are playing can be opened read only with /nbtedit or a keybind.
'''

[[mixins]]
config="nbtedit.client.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
